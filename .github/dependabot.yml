version: 2
updates:
  - package-ecosystem: npm
    directory: /dns-manager
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # @types/node tracks the Node runtime line, not a normal library version. Major bumps are
    # made deliberately alongside CI/Dockerfile/.nvmrc — see TODO.md. Left to Dependabot it
    # proposes EOL or pre-LTS lines (e.g. 20 -> 25, where 25 went EOL 2026-06-01).
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Blocked upstream (see TODO.md): @typescript-eslint and `next build` don't support TS 7,
      # and eslint-config-next crashes under ESLint 10. Remove each rule when its blocker clears.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
    groups:
      # One PR per directory for security fixes, instead of one PR per vulnerable package.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
      tailwind-ecosystem:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
          - "tailwind-merge"
      shadcn-ui:
        patterns:
          - "@base-ui/react"
          - "shadcn"
          - "class-variance-authority"
          - "clsx"
          - "lucide-react"
      types-and-tooling:
        patterns:
          - "@types/*"
          - "typescript"
          - "eslint"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      mcp-server-deps:
        patterns:
          - "*"
        # Majors must not ride in on a grouped bump — that is how typescript 6 -> 7 arrived
        # bundled with routine updates in #66/#79. Ungrouped majors still get their own PR.
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /dns-manager
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # Keeps the pinned node:24-alpine digest fresh. Node majors move deliberately with CI,
    # .nvmrc, engines and @types/node — see TODO.md.
    ignore:
      - dependency-name: "node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
