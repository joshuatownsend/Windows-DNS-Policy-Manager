name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dns-manager/package-lock.json

      - name: Install dependencies
        working-directory: dns-manager
        run: npm ci

      - name: TypeScript build
        working-directory: dns-manager
        run: npm run build

      - name: Typecheck
        working-directory: dns-manager
        # Runs after "TypeScript build" because tsc needs next-env.d.ts, which
        # `next build` generates (it is gitignored and absent on a fresh checkout).
        run: npm run typecheck

      - name: Lint
        working-directory: dns-manager
        run: npm run lint

      - name: Install Playwright browsers
        working-directory: dns-manager
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        working-directory: dns-manager
        run: npm run test:e2e

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build (tsc — fails on type errors)
        working-directory: mcp-server
        run: npm run build

  bridge-tests:
    # Pester tests for the PowerShell bridge's security boundaries (command allowlist,
    # request-size limits, background-job reaping). The bridge targets Windows PowerShell
    # 5.1, so the suite runs under both 5.1 and pwsh 7.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pester (pwsh 7)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = 'server/tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = 'server/tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
