name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dns-manager/package-lock.json

      - name: Install dependencies
        working-directory: dns-manager
        run: npm ci

      - name: TypeScript build
        working-directory: dns-manager
        run: npm run build

      - name: Typecheck
        working-directory: dns-manager
        # Runs after "TypeScript build" because tsc needs next-env.d.ts, which
        # `next build` generates (it is gitignored and absent on a fresh checkout).
        run: npm run typecheck

      - name: Lint
        working-directory: dns-manager
        run: npm run lint

      - name: Unit tests
        working-directory: dns-manager
        run: npm test

      - name: Install Playwright browsers
        working-directory: dns-manager
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        working-directory: dns-manager
        run: npm run test:e2e

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build (tsc — fails on type errors)
        working-directory: mcp-server
        run: npm run build

  docker:
    # The release workflow only runs on tags, so without this a broken Dockerfile or base-image
    # digest bump would not surface until release time. Builds the image without pushing it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (no push)
        run: docker build --tag dns-manager:ci ./dns-manager

      - name: Smoke test
        run: |
          docker run -d --name dns-manager-ci -p 10010:10010 dns-manager:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:10010/server; then
              docker exec dns-manager-ci id
              exit 0
            fi
            sleep 1
          done
          docker logs dns-manager-ci
          exit 1
